<style>

  #home{position:fixed;left:12px;top:10px;z-index:70;width:46px;height:46px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none;background:var(--card);box-shadow:0 4px 0 #d9b481;}
  #home:active{transform:translateY(3px);box-shadow:0 1px 0 #d9b481;}
  header{width:100%;max-width:560px;text-align:center;padding:10px 14px 0;}
  .title{font-size:22px;font-weight:900;letter-spacing:1px;}
  .chips{display:flex;justify-content:center;gap:8px;margin-top:6px;}
  .chip{font-size:15px;font-weight:900;background:var(--card);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 #d9b481;border:none;font-family:inherit;color:var(--ink);}
  .chip.pop{animation:chipPop .4s;}
  @keyframes chipPop{40%{transform:scale(1.25);}}
  button.chip{cursor:pointer;}
  button.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #d9b481;}
  .btn{border:none;font-family:inherit;font-weight:900;color:#fff;border-radius:999px;cursor:pointer;transition:transform .08s;}
  .btn:active{transform:translateY(2px);}
  .btn.green{background:linear-gradient(180deg,#7bdc8a,#34c759);box-shadow:0 4px 0 #1f9e44;}
  .btn.orange{background:linear-gradient(180deg,#ffb703,#fb8500);box-shadow:0 4px 0 #c96a00;}
  .btn.brown{background:linear-gradient(180deg,#b98a52,#8a5a2b);box-shadow:0 4px 0 #5e3c1c;}

  .screen{flex:1;display:none;flex-direction:column;min-height:0;}
  .screen.show{display:flex;}
  /* ── おうちマップ ── */
  #map-s .hint{text-align:center;font-size:14px;font-weight:800;color:#8a7a66;margin:2px 0 8px;}
  #next{text-align:center;font-size:13px;font-weight:800;color:#b06a00;margin-bottom:6px;min-height:16px;}
  #roomGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;overflow:auto;touch-action:pan-y;padding:4px 2px 8px;}
  .rcard{position:relative;background:var(--card);border-radius:18px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;
    box-shadow:0 5px 0 #d9b481;cursor:pointer;}
  .rcard:active{transform:translateY(3px);box-shadow:0 2px 0 #d9b481;}
  .rcard .re{font-size:42px;line-height:1.1;}
  .rcard .rn{font-size:16px;font-weight:900;}
  .rcard .rp{font-size:12px;font-weight:800;color:#8a7a66;}
  .rcard .paw{position:absolute;right:8px;top:6px;font-size:20px;animation:bob 1.2s ease-in-out infinite;}
  .rcard .secmark{position:absolute;left:10px;top:8px;font-size:15px;}
  .rcard.locked{cursor:default;background:#efe6d4;box-shadow:0 5px 0 #cbbb9b;}
  .rcard.locked:active{transform:none;box-shadow:0 5px 0 #cbbb9b;}
  .rcard.locked .re{filter:grayscale(1) opacity(.55);}

  #roomTop{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  #roomTop .btn{font-size:14px;padding:9px 14px;flex:0 0 auto;}
  #roomName{flex:1;text-align:center;font-size:18px;font-weight:900;}
  #roomHint{text-align:center;font-size:13px;font-weight:800;color:#8a7a66;min-height:16px;flex:0 0 auto;}

  .spot{position:absolute;transform:translate(-50%,-50%);padding:8px;line-height:1;cursor:pointer;z-index:2;}
  .spot .se{display:block;font-size:calc(var(--u,44px) * var(--s,1));filter:drop-shadow(0 3px 3px rgba(0,0,0,.22));transition:opacity .3s, filter .3s;}
  .spot.done{pointer-events:none;}
  .spot.done .se{opacity:.35;filter:grayscale(.9);}
  .spot.poke .se{animation:poke .35s;}
  @keyframes poke{25%{transform:rotate(-9deg) scale(1.12);}60%{transform:rotate(8deg) scale(1.05);}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .float{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:17px;color:#5b4636;
    text-shadow:0 1px 0 #fff,0 0 6px #fff;pointer-events:none;z-index:6;white-space:nowrap;transition:transform 1s ease, opacity 1s;}
  #allDone{position:absolute;left:50%;bottom:10px;transform:translate(-50%,120%);z-index:7;background:var(--card);border-radius:16px;

  .bcell .be{font-size:30px;line-height:1.1;}
  .bcell .bn{font-size:8.5px;font-weight:800;text-align:center;line-height:1.05;overflow:hidden;max-width:100%;white-space:nowrap;text-overflow:ellipsis;}
  .bcell .br{font-size:8px;color:#f0a500;letter-spacing:-1px;}
  .bcell.none{background:#efe6d4;box-shadow:0 3px 0 #cbbb9b;}
  .bcell.none .be{filter:grayscale(1) brightness(.55) contrast(.5);opacity:.75;}
  .booktitle{text-align:center;font-size:18px;font-weight:900;margin:2px 0 4px;flex:0 0 auto;}
  .booktitle small{color:#8a7a66;font-size:13px;}
  #book-s .btn.back{align-self:center;font-size:16px;padding:10px 24px;margin-top:8px;flex:0 0 auto;}

  #ovl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(60,45,25,.6);z-index:90;padding:24px;}
  #ovl.show{display:flex;}
  .sheet{background:var(--card);border-radius:22px;padding:20px 18px;max-width:330px;width:100%;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.4);}
  .sheet .ce{font-size:74px;line-height:1.15;animation:cardIn .5s;}
  @keyframes cardIn{0%{transform:scale(.2) rotate(-16deg);}65%{transform:scale(1.18);}100%{transform:scale(1);}}
  .sheet .ct{font-size:21px;font-weight:900;margin-top:6px;}
  .sheet .cs{font-size:14px;font-weight:800;color:#8a7a66;margin-top:3px;}
  .sheet .cr{font-size:15px;color:#f0a500;margin-top:2px;}
  .sheet .btn{font-size:17px;padding:11px 28px;margin-top:12px;}
  .sheet.gold{background:linear-gradient(180deg,#fff8dd,#ffe9a8);}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden;}
  .conf{position:absolute;font-size:26px;will-change:transform;}
  /* ── よこむき ── */
  @media (orientation:landscape) and (max-height:480px){
    header{padding:4px 14px 0;} .title{font-size:17px;}
    .chips{margin-top:3px;} .chip{font-size:13px;padding:3px 11px;}
    #map-s .hint{margin:0 0 4px;font-size:12px;}
    #roomGrid{grid-template-columns:repeat(4,1fr);gap:8px;}
    .rcard .re{font-size:30px;}
    .bgrid{grid-template-columns:repeat(8,1fr);}
  }
</style>

<script>

   - おとは Web Audio。がぞくアセットなし（emoji のみ）

// ── へやデータ（sec = ひみつの かぐの ばんごう）──

const RBY={}; ROOMS.forEach(r=>RBY[r.id]=r);

// ── たからデータ（sec:true は「ひみつ」でしか でない）──
const ITEMS=[
  {id:"ball",  room:"genkan", e:"⚽", nm:"ボール",           r:1},

const IBY={}; ITEMS.forEach(it=>IBY[it.id]=it);
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
const EMPTIES=[["🕸️","くもの すだ…"],["🧦","くつしたが でてきた"],["💨","ほこりだけ…"],["🐜","ありさん こんにちは"]];

// ── セーブ（st=ほし, tr=たから, se=ひみつずみのへや, un=アンロックえんしゅつずみ）──
const SAVE="himitsu.save";
let S={st:0, tr:new Set(), se:new Set(), un:new Set()};
try{
  const d=JSON.parse(localStorage.getItem(SAVE));
  if(d){ S.st=d.st|0; S.tr=new Set((d.tr||[]).filter(id=>IBY[id])); S.se=new Set((d.se||[]).filter(id=>RBY[id])); S.un=new Set(d.un||[]); }
}catch(e){}
function save(){ try{ localStorage.setItem(SAVE, JSON.stringify({st:S.st,tr:[...S.tr],se:[...S.se],un:[...S.un]})); }catch(e){} }
const unlocked=r=>S.st>=r.need;

// ── ねこの かくれんぼ（ひらくたびに どこかの へやへ）──
const cat={room:null, found:false};
function placeCat(){
  const rs=ROOMS.filter(unlocked);
  cat.room=rs[(Math.random()*rs.length)|0].id;
}
placeCat();

// ── おと ──
let actx=null;
function beep(f,d=0.07,t="sine",v=0.13){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.stop(actx.currentTime+d);}catch(e){}}
function tick(){ beep(620,0.04,"sine",0.1); }
function pokeSnd(){ beep(300,0.05,"triangle",0.12); }
function coinSnd(){ beep(880,0.08,"square",0.09); setTimeout(()=>beep(1320,0.12,"square",0.09),70); }
function winSnd(){ [659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.12,"triangle",0.18),i*80)); }
function fanfare(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.17,"triangle",0.2),i*90)); }
function meow(){ beep(700,0.12,"sine",0.14); setTimeout(()=>beep(560,0.16,"sine",0.14),120); }
function buzz(){ try{navigator.vibrate&&navigator.vibrate(25);}catch(e){} }

const confEl=document.getElementById("confetti");
function confetti(){const emo=["🎉","⭐","🌟","✨","🎊","🗝️","🌈"];for(let i=0;i<22;i++){const s=document.createElement("div");s.className="conf";s.textContent=emo[(Math.random()*emo.length)|0];const x=Math.random()*100,dur=1100+Math.random()*900,delay=Math.random()*250;s.style.left=x+"vw";s.style.top="-40px";s.style.transition=`transform ${dur}ms cubic-bezier(.3,.6,.5,1) ${delay}ms, opacity ${dur}ms ${delay}ms`;confEl.appendChild(s);requestAnimationFrame(()=>{s.style.transform=`translateY(${window.innerHeight+80}px) rotate(${(Math.random()*720-360)|0}deg)`;s.style.opacity="0.2";});setTimeout(()=>s.remove(),dur+delay+100);}}

// ── がめん・HUD ──
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("show",s.id===id)); }
const starChip=document.getElementById("starChip"), bookChip=document.getElementById("bookChip");
function updateHUD(pop){
  starChip.textContent="⭐ "+S.st;
  bookChip.textContent="🎁 "+S.tr.size+"/"+ITEMS.length;
  if(pop){ starChip.classList.remove("pop"); void starChip.offsetWidth; starChip.classList.add("pop"); }
}

// ── おうちマップ ──
function buildMap(){
  const g=document.getElementById("roomGrid"); g.innerHTML="";
  ROOMS.forEach(r=>{
    const ok=unlocked(r);
    const c=document.createElement("div"); c.className="rcard"+(ok?"":" locked");
    const pool=ITEMS.filter(it=>it.room===r.id);
    const got=pool.filter(it=>S.tr.has(it.id)).length;
    let sub, bar="";
    if(ok){ sub=`🎁 ${got}/${pool.length}`; }
    else{
      sub=`🔒 ⭐${r.need}こで あく`;
      bar=`<div class="lockbar"><i style="width:${Math.min(100,S.st/r.need*100)}%"></i></div>`;
    }
    c.innerHTML=
      (S.se.has(r.id)?`<span class="secmark">✨</span>`:"")+
      (ok&&cat.room===r.id&&!cat.found?`<span class="paw">🐾</span>`:"")+
      `<div class="re">${r.e}</div><div class="rn">${r.nm}</div><div class="rp">${sub}</div>${bar}`;
    if(ok) c.addEventListener("click",()=>{ tick(); enterRoom(r); });
    else c.addEventListener("click",pokeSnd);
    g.appendChild(c);
  });
  // つぎの もくひょう
  const nx=ROOMS.find(r=>!unlocked(r));
  document.getElementById("next").textContent = nx ? `つぎ： あと ⭐${nx.need-S.st}こで 「${nx.nm}」の かぎが あくよ` : "ぜんぶの へやが あいたよ！すごい！";
  document.getElementById("compBanner").classList.toggle("show", S.tr.size===ITEMS.length);
}
function goMap(){ V=null; buildMap(); updateHUD(); show("map-s"); }

// ── へやの なか ──
let V=null; // いま の へや（contents, opened, secTaps）
const scene=document.getElementById("scene");
function sizeScene(){
  const r=scene.getBoundingClientRect();
  scene.style.setProperty("--u", Math.max(30, Math.min(r.width/6, r.height/6.5))+"px");
}
let rsT=null;
addEventListener("resize",()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(V) sizeScene(); },150); });

function pickItem(room){
  const pool=ITEMS.filter(it=>it.room===room.id && !it.sec);
  const un=pool.filter(it=>!S.tr.has(it.id));
  const src=un.length?un:pool;
  return src[(Math.random()*src.length)|0].id;
}
function deal(room){
  const n=room.spots.length;
  const cont=Array.from({length:n},()=>({t:"empty", em:EMPTIES[(Math.random()*EMPTIES.length)|0]}));
  const free=[...Array(n).keys()];
  if(!S.se.has(room.id)){ cont[room.sec]={t:"secret"}; free.splice(free.indexOf(room.sec),1); }
  // シャッフル
  for(let i=free.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [free[i],free[j]]=[free[j],free[i]]; }
  if(cat.room===room.id && !cat.found && free.length) cont[free.pop()]={t:"cat"};
  for(let k=0;k<3&&free.length;k++) cont[free.pop()]={t:"star"};
  for(let k=0;k<2&&free.length;k++) cont[free.pop()]={t:"tre", id:pickItem(room)};
  return cont;
}
function enterRoom(room){
  V={room, cont:deal(room), opened:new Set(), secTaps:0};
  document.getElementById("roomName").textContent=room.e+" "+room.nm;
  document.getElementById("roomHint").textContent = S.se.has(room.id) ? "かぐを タップして さがしてね" : "かぐを タップ！ どこかに ひみつが…";
  scene.style.background=`linear-gradient(180deg, ${room.wall} 0 52%, ${room.floor} 52% 100%)`;
  scene.querySelectorAll(".spot,.float").forEach(el=>el.remove());
  document.getElementById("allDone").classList.remove("show");
  room.spots.forEach((sp,i)=>{
    const d=document.createElement("div"); d.className="spot";
    d.style.left=sp[1]+"%"; d.style.top=sp[2]+"%"; d.style.setProperty("--s",sp[3]);
    d.innerHTML=`<span class="se">${sp[0]}</span>`;
    d.addEventListener("pointerdown",()=>openSpot(i,d));
    scene.appendChild(d);
  });
  updateLeft();
  show("room-s");
  requestAnimationFrame(sizeScene);
}
function updateLeft(){ document.getElementById("leftChip").textContent="🔍 "+(V.room.spots.length-V.opened.size); }
function floatText(spotEl,txt){
  const f=document.createElement("div"); f.className="float"; f.textContent=txt;
  f.style.left=spotEl.style.left; f.style.top=spotEl.style.top;
  scene.appendChild(f);
  requestAnimationFrame(()=>{ f.style.transform="translate(-50%,-140%)"; f.style.opacity="0"; });
  setTimeout(()=>f.remove(),1100);
}
function poke(el){ el.classList.remove("poke"); void el.offsetWidth; el.classList.add("poke"); }
function addStars(n,pop=true){ S.st+=n; save(); updateHUD(pop); }

function openSpot(i,el){
  if(!V||V.opened.has(i)) return;
  if(actx&&actx.state==="suspended")actx.resume();
  const c=V.cont[i];
  poke(el); buzz();
  // ひみつは 3かい タップで はっけん
  if(c.t==="secret"){
    V.secTaps++;
    if(V.secTaps>=3){ foundSecret(i,el); }
    else{ pokeSnd(); beep(980,0.09,"triangle",0.12); floatText(el, V.secTaps===1?"✨ なにか ありそう！":"✨✨ もう すこし！"); }
    return;
  }
  V.opened.add(i); el.classList.add("done"); updateLeft();
  if(c.t==="star"){
    coinSnd(); addStars(1); floatText(el,"⭐ +1"); afterOpen();
  }else if(c.t==="tre"){
    const it=IBY[c.id];
    if(!S.tr.has(it.id)){
      S.tr.add(it.id); save(); updateHUD(); winSnd(); if(it.r>=2)confetti();
      showCard({e:it.e, t:"みつけた！", s:it.nm, r:stars(it.r)});
    }else{
      coinSnd(); addStars(1);
      showCard({e:it.e, t:"もういっこ みつけた！", s:it.nm+"　⭐+1"});
    }
  }else if(c.t==="cat"){
    cat.found=true; meow(); addStars(3); confetti();
    showCard({e:"🐈", t:"ねこちゃん みっけ！", s:"かくれんぼ じょうず！　⭐+3"});
  }else{
    pokeSnd(); floatText(el, c.em[0]+" "+c.em[1]); afterOpen();
  }
}
function foundSecret(i,el){
  const room=V.room;
  V.opened.add(i); el.classList.add("done"); updateLeft();
  S.se.add(room.id);
  const it=ITEMS.find(x=>x.room===room.id&&x.sec);
  const isNew=!S.tr.has(it.id);
  if(isNew) S.tr.add(it.id);
  S.st+=3; save(); updateHUD(true);
  fanfare(); confetti();
  document.getElementById("roomHint").textContent="かぐを タップして さがしてね";
  showCard({e:it.e, t:"🎉 ひみつ はっけん！", s:it.nm+"　⭐+3", r:stars(it.r), gold:true});
}
function afterOpen(){
  if(V && V.opened.size>=V.room.spots.length){
    setTimeout(()=>document.getElementById("allDone").classList.add("show"),500);
  }
  checkUnlock();
}

// ── みつけたカード ──
const ovl=document.getElementById("ovl"), sheet=document.getElementById("sheet");
function showCard(o){
  sheet.className="sheet"+(o.gold?" gold":"");
  sheet.innerHTML=`<div class="ce">${o.e}</div><div class="ct">${o.t}</div>`+
    (o.s?`<div class="cs">${o.s}</div>`:"")+(o.r?`<div class="cr">${o.r}</div>`:"")+
    `<button class="btn green" id="cardOk">やったね！</button>`;
  ovl.classList.add("show");
  document.getElementById("cardOk").addEventListener("click",()=>{ tick(); ovl.classList.remove("show"); afterOpen(); });
}

// ── アンロック（ほしが たまったら あたらしい へや）──
function checkUnlock(){
  if(ovl.classList.contains("show")) return;
  const r=ROOMS.find(x=>x.need>0 && unlocked(x) && !S.un.has(x.id));
  if(!r) return;
  S.un.add(r.id); save();
  fanfare(); confetti();
  sheet.className="sheet gold";
  sheet.innerHTML=`<div class="ce">${r.e}</div><div class="ct">🔓 かぎが あいた！</div>`+
    `<div class="cs">「${r.nm}」に はいれるように なったよ！</div>`+
    `<button class="btn orange" id="cardOk">みにいく！</button>`;
  ovl.classList.add("show");
  document.getElementById("cardOk").addEventListener("click",()=>{ tick(); ovl.classList.remove("show"); goMap(); checkUnlock(); });
}

// ── たからちょう ──
function buildBook(){
  document.getElementById("bCount").textContent=S.tr.size;
  document.getElementById("bTotal").textContent=ITEMS.length;
  const w=document.getElementById("bookWrap"); w.innerHTML="";
  ROOMS.forEach(r=>{
    const pool=ITEMS.filter(it=>it.room===r.id);
    const sec=document.createElement("div"); sec.className="bsec";
    sec.innerHTML=`<h3>${r.e} ${r.nm}</h3>`;
    const g=document.createElement("div"); g.className="bgrid";
    pool.forEach(it=>{
      const got=S.tr.has(it.id);
      const c=document.createElement("div"); c.className="bcell"+(got?"":" none");
      c.innerHTML=`<div class="be">${got?it.e:(it.sec?"❓":"❔")}</div>`+
        `<div class="bn">${got?it.nm:"？？？"}</div><div class="br">${got?stars(it.r):""}</div>`;
      g.appendChild(c);
    });
    sec.appendChild(g); w.appendChild(sec);
  });
}

// ── ボタン ──
document.getElementById("backMap").addEventListener("click",()=>{ tick(); goMap(); });
document.getElementById("doneBack").addEventListener("click",()=>{ tick(); goMap(); });
document.getElementById("toBook").addEventListener("click",()=>{ tick(); buildBook(); show("book-s"); });
document.getElementById("bookChip").addEventListener("click",()=>{ tick(); buildBook(); show("book-s"); });
// へやの とちゅうで ひらいたら、へやを こわさず そのまま もどる
document.getElementById("bookBack").addEventListener("click",()=>{ tick(); if(V){ show("room-s"); requestAnimationFrame(sizeScene); } else goMap(); });

// ── スタート ──
updateHUD(); goMap();
</script>
</body>
</html>
