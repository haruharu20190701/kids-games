<style>
  /* ── スコープシュート（3D・three.js 同梱／えもじ なし）── */
  :root{ --bg1:#20304a; --bg2:#101827; --ink:#eef4ff; --card:#22304a; --line:#5c7ba8; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    height:100dvh;overflow:hidden;touch-action:none;
  }
  #home{position:fixed;left:10px;top:9px;z-index:80;width:44px;height:44px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;text-decoration:none;background:#eef4ff;box-shadow:0 4px 0 #43648f;}
  #home:active{transform:translateY(3px);box-shadow:0 1px 0 #43648f;}
  #home canvas{display:block;image-rendering:pixelated;}
  header{width:100%;max-width:640px;text-align:center;padding:9px 14px 0;flex:0 0 auto;}
  .title{font-size:20px;font-weight:900;letter-spacing:2px;}
  .btn{border:none;font-family:inherit;font-weight:900;color:#10202f;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,#cfe6ff,#8ec2f0);box-shadow:0 4px 0 #2f6a9e;transition:transform .07s;}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2f6a9e;}
  .btn.green{background:linear-gradient(180deg,#b6f0a8,#5ad46a);box-shadow:0 4px 0 #2f8f3a;}
  .btn.red{background:linear-gradient(180deg,#ffb8a8,#f0705a);box-shadow:0 4px 0 #a8402e;}
  .btn.gray{background:linear-gradient(180deg,#dfe6ef,#a7b4c4);box-shadow:0 4px 0 #6d7d90;}
  .btn.yellow{background:linear-gradient(180deg,#ffe9a8,#ffc94d);box-shadow:0 4px 0 #b3822a;}
  .btn:disabled{opacity:.42;}
  #app{flex:1;width:100%;max-width:640px;display:flex;flex-direction:column;min-height:0;padding:4px 8px 8px;}
  .screen{flex:1;display:none;flex-direction:column;min-height:0;}
  .screen.show{display:flex;}
  /* スタート */
  #start-s{align-items:center;justify-content:center;gap:14px;}
  #start-s .lead{font-size:14px;font-weight:800;color:#b7cbe4;text-align:center;line-height:1.8;}
  #start-s .btn{font-size:20px;padding:14px 30px;}
  #start-s .rec{font-size:13px;font-weight:800;color:#9ab0cc;}
  /* ゲーム */
  #play-s{gap:5px;}
  #hud{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;flex:0 0 auto;}
  #hud .cell{background:#26374f;border:2px solid #46628a;padding:3px 8px;}
  #hud .cell b{color:#ffd93b;font-size:14px;}
  #stageLbl{flex:1;text-align:center;font-size:14px;}
  #view{position:relative;flex:1;min-height:0;min-width:0;overflow:hidden;border:3px solid #46628a;}
  #cv{display:block;width:100%;height:100%;touch-action:none;}
  /* スコープ（まるい あな＋レティクル）*/
  #scope{position:absolute;inset:0;display:none;pointer-events:none;}
  #scope.on{display:block;}
  #scope .hole{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
    box-shadow:0 0 0 9999px rgba(4,8,14,.94), inset 0 0 40px rgba(0,0,0,.75);}
  #scope .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(210,230,255,.35);}
  #scope .cx,#scope .cy{position:absolute;background:rgba(20,28,38,.9);}
  #scope .cx{left:50%;top:50%;height:1px;transform:translate(-50%,-50%);}
  #scope .cy{left:50%;top:50%;width:1px;transform:translate(-50%,-50%);}
  #scope .mil{position:absolute;left:50%;background:rgba(20,28,38,.85);height:1px;transform:translateX(-50%);}
  #scope .dot{position:absolute;left:50%;width:3px;height:3px;background:#e8443a;border-radius:50%;transform:translate(-50%,-50%);}
  /* かぜ・きょり */
  #info{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:8px;pointer-events:none;}
  #info div{background:rgba(10,18,30,.6);border:2px solid rgba(120,160,210,.5);padding:2px 8px;font-size:12px;font-weight:900;}
  #windArrow{display:inline-block;transform-origin:50% 50%;}
  #hitMsg{position:absolute;left:0;right:0;top:14%;text-align:center;font-size:26px;font-weight:900;
    color:#ffd93b;text-shadow:0 2px 0 #7a4a00,0 0 12px rgba(0,0,0,.6);opacity:0;transition:opacity .2s;pointer-events:none;}
  #hitMsg.on{opacity:1;}
  /* ボタン */
  #ctrl{display:flex;gap:6px;flex:0 0 auto;align-items:stretch;}
  #ctrl .btn{flex:1;font-size:14px;padding:11px 4px;}
  #ctrl .btn.fire{flex:1.4;font-size:18px;}
  #breathWrap{flex:1;display:flex;flex-direction:column;gap:2px;}
  #breathBar{height:5px;background:#26374f;border:1px solid #46628a;}
  #breathBar i{display:block;height:100%;background:#5ad46a;width:100%;}
  /* オーバーレイ */
  .ovl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,12,22,.85);z-index:90;padding:18px;}
  .ovl.show{display:flex;}
  .sheet{background:var(--card);border:3px solid var(--line);padding:16px;max-width:340px;width:100%;text-align:center;}
  .sheet h2{margin:0 0 6px;font-size:20px;}
  .sheet .sub{font-size:14px;font-weight:800;color:#b7cbe4;line-height:1.7;}
  .sheet .row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .sheet .btn{font-size:16px;padding:10px 18px;}
  .stars{display:flex;gap:8px;justify-content:center;margin:10px 0;}
  .stars canvas{image-rendering:pixelated;}
  @media (orientation:landscape) and (max-height:520px){
    header{padding:3px 14px 0;} .title{font-size:16px;}
    #hud{font-size:11px;} #ctrl .btn{font-size:13px;padding:8px 4px;}
  }
</style>
</head>
<body>
  <a id="home" href="../../index.html" title="メニューへ"><canvas id="homeCv" width="26" height="26"></canvas></a>
  <header><div class="title">スコープシュート</div></header>

  <div id="app">
    <section id="start-s" class="screen show">
      <div class="lead">
        とおくの まとを みずでっぽうで うちぬく ゲーム。<br>
        ゆびで あたりを みまわして、スコープで ズーム。<br>
        <b>とおいと たまは おちる。かぜでも ながれる</b>ので、<br>
        すこし うえや よこを ねらうのが コツ！
      </div>
      <button class="btn green" id="btnGo">はじめる</button>
      <div class="rec" id="rec"></div>
      <button class="btn gray" id="btnFirst" style="font-size:13px;padding:8px 14px;display:none">ステージ1 から</button>
    </section>

    <section id="play-s" class="screen">
      <div id="hud">
        <span style="width:40px;flex:0 0 auto"></span>
        <div class="cell">たま <b id="ammoLbl">0</b></div>
        <div id="stageLbl">ステージ 1</div>
        <div class="cell">まと <b id="leftLbl">0</b></div>
        <div class="cell">とくてん <b id="scoreLbl">0</b></div>
      </div>
      <div id="view">
        <canvas id="cv"></canvas>
        <div id="scope">
          <div class="hole" id="scHole"></div>
          <div class="ring" id="scRing"></div>
          <div class="cx" id="scCx"></div>
          <div class="cy" id="scCy"></div>
          <div id="scMils"></div>
        </div>
        <div id="hitMsg"></div>
        <div id="info">
          <div>かぜ <span id="windArrow">→</span> <span id="windLbl">0.0</span></div>
          <div>きょり <span id="distLbl">--</span>m</div>
          <div id="zoomLbl">ズーム ×1</div>
        </div>
      </div>
      <div id="ctrl">
        <button class="btn gray" id="btnQuit">やめる</button>
        <button class="btn yellow" id="btnZoom">スコープ</button>
        <div id="breathWrap">
          <button class="btn" id="btnBreath" style="flex:1;font-size:13px;line-height:1.15">いき<br>とめる</button>
          <div id="breathBar"><i id="breathI"></i></div>
        </div>
        <button class="btn red fire" id="btnFire">うつ</button>
      </div>
    </section>
  </div>

  <div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>

<script type="module">
/* =========================================================
   スコープシュート（3D）
   - three.js は リポジトリ どうこん（../../shared/three/・MIT）。
     CDN は つかわない ＝ オフラインでも うごく
   - みずでっぽうの まとあて。ふうせん・カン・まとばん・うごく まと を ねらう
   - スナイパーらしさ：スコープの ズーム、かぜ ながれ、たまの おちかた（じゅうりょく）、
     ズームすると ゆれる（いきを とめると とまる）、あたると スローモーション
   - ステージは じどうせいせい。とおく なるほど かぜも つよくなる
   - すすんだ ステージと さいこう とくてんは localStorage に ほぞん
   ========================================================= */
import * as THREE from "../../shared/three/three.module.min.js";

/* ── いえアイコン（ホームボタン・ドット）── */
(function(){ const t=document.getElementById("homeCv").getContext("2d");
  const P=(x,y,w,h,c)=>{t.fillStyle=c;t.fillRect(x,y,w,h);};
  P(3,11,20,14,"#c98d5a"); P(5,13,16,12,"#e8b07a"); P(1,11,24,2,"#8a5a2b");
  for(let i=0;i<11;i++) P(12-i,11-i,2+i*2,1,"#c0392b");
  P(10,16,6,9,"#7a4f2a"); P(14,20,1,1,"#ffd93b");
})();
function starCanvas(on){
  const c=document.createElement("canvas"); c.width=14; c.height=14;
  const t=c.getContext("2d"); const P=(x,y,w,h,col)=>{t.fillStyle=col;t.fillRect(x,y,w,h);};
  const col=on?"#ffd93b":"#4a5a70", col2=on?"#c9970f":"#3a4658";
  P(6,1,2,12,col); P(1,6,12,2,col); P(3,3,8,8,col); P(4,2,6,10,col); P(2,4,10,6,col); P(5,5,4,4,col2);
  c.style.width="30px"; c.style.height="30px"; return c;
}

/* ── セーブ ── */
const SAVE="scope.save";
let S={stage:1, best:0};
try{ const d=JSON.parse(localStorage.getItem(SAVE)); if(d){ S.stage=Math.max(1,d.stage|0); S.best=Math.max(0,d.best|0); } }catch(e){}
function save(){ try{ localStorage.setItem(SAVE, JSON.stringify(S)); }catch(e){} }

/* ── おと ── */
let actx=null;
function ac(){ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume(); return actx; }
function beep(f,d=0.07,t="sine",v=0.1){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d);}catch(e){}}
function noise(d=0.2,v=0.12,hp=600){try{const a=ac(),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
  f.type="highpass"; f.frequency.value=hp; g.gain.value=v; s.buffer=b; s.connect(f); f.connect(g); g.connect(a.destination); s.start();}catch(e){}}
const sShot=()=>{ noise(0.12,0.14,900); beep(320,0.08,"sine",0.06); };
const sPop=()=>{ beep(880,0.05,"square",0.12); setTimeout(()=>noise(0.1,0.09,1200),20); };
const sClank=()=>{ beep(420,0.09,"square",0.1); setTimeout(()=>beep(300,0.12,"square",0.07),60); };
const sSplash=()=>noise(0.22,0.07,400);
const sBull=()=>[784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.1,"triangle",0.13),i*70));
const sClear=()=>[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.16,"triangle",0.15),i*100));
const sFail=()=>{ beep(240,0.2,"sawtooth",0.11); setTimeout(()=>beep(170,0.3,"sawtooth",0.1),160); };
const sTick=()=>beep(620,0.04,"square",0.07);

/* ── 3D の じゅんび ── */
const cv=document.getElementById("cv");
const renderer=new THREE.WebGLRenderer({canvas:cv, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fc7f0);
scene.fog=new THREE.Fog(0xa9d4f2, 120, 620);
const camera=new THREE.PerspectiveCamera(60,1,0.1,1500);
camera.position.set(0,1.7,0);

scene.add(new THREE.HemisphereLight(0xdfefff, 0x6a8a5a, 1.05));
const sun=new THREE.DirectionalLight(0xfff6e0, 0.85); sun.position.set(-60,90,40); scene.add(sun);

/* じめん */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),
  new THREE.MeshLambertMaterial({color:0x6fa85a}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
/* しゃげきレンジの みち */
const lane=new THREE.Mesh(new THREE.PlaneGeometry(14,600),
  new THREE.MeshLambertMaterial({color:0xc2b183}));
lane.rotation.x=-Math.PI/2; lane.position.set(0,0.02,-300); scene.add(lane);
/* きょりの めじるし（50mごと）*/
for(let d=50; d<=350; d+=50){
  const post=new THREE.Mesh(new THREE.BoxGeometry(0.35,1.6,0.35), new THREE.MeshLambertMaterial({color:0xf0f0f0}));
  post.position.set(-7.4,0.8,-d); scene.add(post);
  const post2=post.clone(); post2.position.x=7.4; scene.add(post2);
}
/* とおくの やま */
for(let i=0;i<16;i++){
  const r=90+Math.random()*90, h=40+Math.random()*70;
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),
    new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(0.30,0.28,0.30+Math.random()*0.1)}));
  const a=(-0.9+ i/15*1.8);
  m.position.set(Math.sin(a)*700, h/2-6, -Math.cos(a)*700-60);
  scene.add(m);
}
/* き（レンジの りょうわき）*/
function tree(x,z,s){
  const g=new THREE.Group();
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.25*s,0.35*s,2.4*s,6), new THREE.MeshLambertMaterial({color:0x6b4a2a}));
  tr.position.y=1.2*s; g.add(tr);
  for(let k=0;k<2;k++){
    const c=new THREE.Mesh(new THREE.ConeGeometry(1.5*s-k*0.4*s, 2.4*s, 7), new THREE.MeshLambertMaterial({color:k?0x3f8f4a:0x357a3f}));
    c.position.y=(2.6+k*1.3)*s; g.add(c);
  }
  g.position.set(x,0,z); scene.add(g);
}
for(let i=0;i<26;i++){
  const side=Math.random()<0.5?-1:1;
  tree(side*(16+Math.random()*40), -20-Math.random()*380, 0.8+Math.random()*0.8);
}
/* くも */
for(let i=0;i<10;i++){
  const c=new THREE.Mesh(new THREE.SphereGeometry(14+Math.random()*14,7,5),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.85}));
  c.position.set(-260+Math.random()*520, 80+Math.random()*40, -180-Math.random()*380);
  c.scale.y=0.45; scene.add(c);
}

/* まとばんの テクスチャ（あかしろの わ）*/
function targetTexture(){
  const c=document.createElement("canvas"); c.width=c.height=128;
  const t=c.getContext("2d");
  const rings=[[64,"#f4f4f4"],[52,"#e8443a"],[40,"#f4f4f4"],[28,"#e8443a"],[16,"#f4f4f4"],[7,"#ffd93b"]];
  for(const [r,col] of rings){ t.beginPath(); t.arc(64,64,r,0,Math.PI*2); t.fillStyle=col; t.fill(); }
  return new THREE.CanvasTexture(c);
}
const targetTex=targetTexture();

/* ── まと ── */
let targets=[], shots=[], fx=[];
const TYPE={BALLOON:0, CAN:1, BOARD:2, CART:3};
function makeTarget(kind,x,y,z,opt){
  const g=new THREE.Group();
  let radius=0.6, pts=100;
  if(kind===TYPE.BALLOON){
    const col=[0xff5a5f,0x3a86ff,0x34c759,0xffd60a,0xb06bff][(Math.random()*5)|0];
    const b=new THREE.Mesh(new THREE.SphereGeometry(0.62,14,12), new THREE.MeshLambertMaterial({color:col}));
    b.scale.y=1.18; g.add(b);
    const s=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1.6,4), new THREE.MeshLambertMaterial({color:0xf0e8d0}));
    s.position.y=-1.1; g.add(s);
    radius=0.72; pts=120;
  }else if(kind===TYPE.CAN){
    const c=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.75,12), new THREE.MeshLambertMaterial({color:0xd8dde2}));
    c.position.y=0.38; g.add(c);
    const band=new THREE.Mesh(new THREE.CylinderGeometry(0.31,0.31,0.24,12), new THREE.MeshLambertMaterial({color:0xe8443a}));
    band.position.y=0.4; g.add(band);
    const stand=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.12,0.5), new THREE.MeshLambertMaterial({color:0x8a5a2b}));
    stand.position.y=0; g.add(stand);
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.12,1.2,0.12), new THREE.MeshLambertMaterial({color:0x8a5a2b}));
    leg.position.y=-0.6; g.add(leg);
    radius=0.42; pts=150;
  }else if(kind===TYPE.BOARD){
    const d=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,0.12,26),
      new THREE.MeshLambertMaterial({map:targetTex}));
    d.rotation.x=Math.PI/2; g.add(d);
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.16,2.2,0.16), new THREE.MeshLambertMaterial({color:0x8a5a2b}));
    leg.position.y=-1.5; g.add(leg);
    radius=1.0; pts=100;
  }else{
    const body=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.9,0.6), new THREE.MeshLambertMaterial({color:0xf0a04b}));
    body.position.y=0.45; g.add(body);
    const w1=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.12,10), new THREE.MeshLambertMaterial({color:0x3a3950}));
    w1.rotation.z=Math.PI/2; w1.position.set(-0.45,0.12,0.3); g.add(w1);
    const w2=w1.clone(); w2.position.set(0.45,0.12,0.3); g.add(w2);
    const flag=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.35,0.05), new THREE.MeshLambertMaterial({color:0xe8443a}));
    flag.position.set(0,1.15,0); g.add(flag);
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.6,6), new THREE.MeshLambertMaterial({color:0xd8dde2}));
    pole.position.set(-0.25,1.0,0); g.add(pole);
    radius=0.8; pts=200;
  }
  g.position.set(x,y,z);
  scene.add(g);
  const t={g, kind, radius, pts, alive:true, base:new THREE.Vector3(x,y,z),
           bob:Math.random()*Math.PI*2, moveA:opt&&opt.moveA||0, moveSpd:opt&&opt.moveSpd||0};
  targets.push(t);
  return t;
}
function clearTargets(){
  for(const t of targets) scene.remove(t.g);
  targets=[];
  for(const s of shots){ scene.remove(s.mesh); if(s.line) scene.remove(s.line); }
  shots=[];
  for(const f of fx) scene.remove(f.m);
  fx=[];
}

/* ── ステージ せいせい ── */
let G=null;
function makeStage(n){
  clearTargets();
  const cnt=Math.min(9, 3+Math.floor(n/2));
  const far=Math.min(300, 55+n*16);
  const near=Math.min(120, 35+n*6);
  for(let i=0;i<cnt;i++){
    const z=-(near+Math.random()*(far-near));
    const x=(Math.random()*2-1)*Math.min(10, 3+Math.abs(z)*0.035);
    let kind;
    const r=Math.random();
    if(n>=3 && r<0.22) kind=TYPE.CART;
    else if(r<0.45) kind=TYPE.BALLOON;
    else if(r<0.72) kind=TYPE.CAN;
    else kind=TYPE.BOARD;
    let y=1.2+Math.random()*1.6;
    if(kind===TYPE.CAN) y=1.3+Math.random()*0.8;
    if(kind===TYPE.CART) y=0.5;
    if(kind===TYPE.BOARD) y=1.8+Math.random()*1.0;
    const moveA=(kind===TYPE.CART)? (2.5+Math.random()*3.5) : 0;
    const moveSpd=(kind===TYPE.CART)? (0.25+Math.random()*0.35+n*0.01) : 0;
    makeTarget(kind,x,y,z,{moveA,moveSpd});
  }
  const windMax=Math.min(3.6, (n-1)*0.45);
  G={ stage:n, ammo:cnt+3, left:cnt, score:0, shotsFired:0, hits:0,
      wind:(Math.random()*2-1)*windMax, over:false, slow:1, slowT:0 };
  yaw=0; pitch=0.02;
  updateHUD();
}
function updateHUD(){
  document.getElementById("ammoLbl").textContent=G.ammo;
  document.getElementById("leftLbl").textContent=G.left;
  document.getElementById("scoreLbl").textContent=G.score;
  document.getElementById("stageLbl").textContent="ステージ "+G.stage;
  const w=G.wind;
  document.getElementById("windLbl").textContent=Math.abs(w).toFixed(1);
  const ar=document.getElementById("windArrow");
  ar.textContent = w>=0 ? "→" : "←";
  ar.style.color = Math.abs(w)>2 ? "#ff8b3d" : "#cfe6ff";
}

/* ── カメラ そうさ ── */
let yaw=0, pitch=0.02, zoomIdx=0, breath=1, breathing=false;
const ZOOMS=[{fov:60,label:"×1"},{fov:20,label:"×3"},{fov:9,label:"×6"}];
let dragging=false, lastX=0, lastY=0;
const view=document.getElementById("view");
view.addEventListener("pointerdown",e=>{ ac(); dragging=true; lastX=e.clientX; lastY=e.clientY; try{view.setPointerCapture(e.pointerId);}catch(_){} });
view.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  const k=0.0026*(ZOOMS[zoomIdx].fov/60);
  yaw-=dx*k; pitch-=dy*k;
  pitch=Math.max(-0.35,Math.min(0.5,pitch));
  yaw=Math.max(-0.65,Math.min(0.65,yaw));
});
view.addEventListener("pointerup",()=>{ dragging=false; });
view.addEventListener("pointercancel",()=>{ dragging=false; });

document.getElementById("btnZoom").addEventListener("click",()=>{
  sTick(); zoomIdx=(zoomIdx+1)%ZOOMS.length;
  document.getElementById("zoomLbl").textContent="ズーム "+ZOOMS[zoomIdx].label;
  document.getElementById("scope").classList.toggle("on", zoomIdx>0);
  layoutScope();
});
const bBtn=document.getElementById("btnBreath");
bBtn.addEventListener("pointerdown",e=>{ e.preventDefault(); if(breath>0.08) breathing=true; });
bBtn.addEventListener("pointerup",()=>{ breathing=false; });
bBtn.addEventListener("pointercancel",()=>{ breathing=false; });
bBtn.addEventListener("pointerleave",()=>{ breathing=false; });
document.getElementById("btnFire").addEventListener("pointerdown",e=>{ e.preventDefault(); fire(); });
document.getElementById("btnQuit").addEventListener("click",()=>{ sTick(); goStart(); });

/* ── スコープの みため（まるい あな）── */
function layoutScope(){
  const r=view.getBoundingClientRect();
  const d=Math.min(r.width,r.height)*0.86;
  const hole=document.getElementById("scHole"), ring=document.getElementById("scRing");
  hole.style.width=d+"px"; hole.style.height=d+"px";
  ring.style.width=(d+6)+"px"; ring.style.height=(d+6)+"px";
  document.getElementById("scCx").style.width=d*0.92+"px";
  document.getElementById("scCy").style.height=d*0.92+"px";
  // ミルドット（したの ほうに めもり）
  const mils=document.getElementById("scMils"); mils.innerHTML="";
  for(let i=1;i<=4;i++){
    const y=d*0.055*i;
    const l=document.createElement("div"); l.className="mil";
    l.style.width=(i%2? d*0.05 : d*0.09)+"px";
    l.style.top="calc(50% + "+y+"px)";
    mils.appendChild(l);
    const dot=document.createElement("div"); dot.className="dot";
    dot.style.top="calc(50% + "+y+"px)"; dot.style.left="calc(50% + "+(d*0.05*i)+"px)";
    mils.appendChild(dot);
    const dot2=document.createElement("div"); dot2.className="dot";
    dot2.style.top="calc(50% + "+y+"px)"; dot2.style.left="calc(50% - "+(d*0.05*i)+"px)";
    mils.appendChild(dot2);
  }
}

/* ── はっしゃ ── */
const GRAV=6.0, SPEED=200;
function fire(){
  ac();
  if(!G||G.over) return;
  if(G.ammo<=0){ sFail(); return; }
  G.ammo--; G.shotsFired++;
  const dir=new THREE.Vector3();
  camera.getWorldDirection(dir);
  const p=camera.position.clone().add(dir.clone().multiplyScalar(0.6));
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.13,8,6), new THREE.MeshLambertMaterial({color:0x7ee8fa}));
  m.position.copy(p); scene.add(m);
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(60*3); geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  geo.setDrawRange(0,0);
  const line=new THREE.Line(geo, new THREE.LineBasicMaterial({color:0x9ff0ff, transparent:true, opacity:0.75}));
  scene.add(line);
  shots.push({mesh:m, line, geo, pts:[], vel:dir.clone().multiplyScalar(SPEED), pos:p.clone(), life:0,
              aim:window.__aimT||null, minD:Infinity, minAt:null});
  sShot();
  updateHUD();
}
function splash(pos,color,n){
  for(let i=0;i<(n||10);i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.10+Math.random()*0.12,6,5),
      new THREE.MeshLambertMaterial({color:color||0x7ee8fa}));
    m.position.copy(pos); scene.add(m);
    fx.push({m, v:new THREE.Vector3((Math.random()-0.5)*7,Math.random()*6+1,(Math.random()-0.5)*7), life:1});
  }
}
function showMsg(t){
  const el=document.getElementById("hitMsg");
  el.textContent=t; el.classList.add("on");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),900);
}

/* ── あたり はんてい ── */
function segSphere(p0,p1,c,r){
  const d=p1.clone().sub(p0), f=p0.clone().sub(c);
  const a=d.dot(d); if(a<1e-9) return false;
  let t=-f.dot(d)/a; t=Math.max(0,Math.min(1,t));
  const q=p0.clone().add(d.multiplyScalar(t));
  return q.distanceTo(c)<=r ? q : false;
}
function hitTarget(t,q){
  t.alive=false;
  G.left--; G.hits++;
  let pts=t.pts, label="ヒット！";
  if(t.kind===TYPE.BOARD){
    const off=q.distanceTo(t.g.position);
    if(off<0.22){ pts=300; label="ど まんなか！"; sBull(); }
    else if(off<0.5){ pts=200; label="ナイス！"; sClank(); }
    else { pts=100; sClank(); }
  }else if(t.kind===TYPE.BALLOON){ sPop(); }
  else if(t.kind===TYPE.CART){ label="うごく まと！"; sClank(); }
  else sClank();
  const dist=t.g.position.distanceTo(camera.position);
  const bonus=Math.floor(dist/10)*5;
  G.score+=pts+bonus;
  showMsg(label+" +"+(pts+bonus));
  splash(q, t.kind===TYPE.BALLOON?0xffd93b:0x7ee8fa, 14);
  // まとの えんしゅつ
  if(t.kind===TYPE.BALLOON){ scene.remove(t.g); }
  else { t.fall=true; t.fallV=0; }
  G.slow=0.25; G.slowT=(G.left===0)?900:320;
  updateHUD();
  if(G.left<=0) setTimeout(stageClear,700);
}

/* ── ループ ── */
let last=0, running=false, tAcc=0;
function loop(ts){
  if(!running) return;
  if(!last) last=ts;
  let dt=Math.min(50, ts-last)/1000; last=ts;
  // スローモーション
  if(G.slowT>0){ G.slowT-=dt*1000; if(G.slowT<=0) G.slow=1; }
  const sdt=dt*G.slow;
  tAcc+=dt;

  // いき（ゆれ）
  if(breathing && breath>0){ breath=Math.max(0,breath-dt*0.42); if(breath<=0) breathing=false; }
  else breath=Math.min(1,breath+dt*0.22);
  document.getElementById("breathI").style.width=(breath*100)+"%";
  // ゆれは かくどで いっていに する（ズームは「よく みえる」だけ）。
  // とおい まと ほど ずれが おおきく なるので、いきを とめる いみが でる
  const swayAmp=(breathing?0.12:1)*0.0032;
  const swayY=Math.sin(tAcc*1.7)*swayAmp, swayP=Math.sin(tAcc*1.13+1.2)*swayAmp*0.7;

  camera.fov=ZOOMS[zoomIdx].fov; camera.updateProjectionMatrix();
  camera.rotation.set(0,0,0,"YXZ");
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw+swayY;
  camera.rotation.x=pitch+swayP;

  // まとの うごき
  for(const t of targets){
    if(t.fall){
      t.fallV+=9.8*sdt; t.g.position.y-=t.fallV*sdt; t.g.rotation.z+=sdt*3;
      if(t.g.position.y<-3){ scene.remove(t.g); t.fall=false; }
      continue;
    }
    if(!t.alive) continue;
    if(t.kind===TYPE.BALLOON){ t.g.position.y=t.base.y+Math.sin(tAcc*1.2+t.bob)*0.22; }
    if(t.moveA>0){ t.g.position.x=t.base.x+Math.sin(tAcc*t.moveSpd*2+t.bob)*t.moveA; }
    if(t.kind===TYPE.BOARD||t.kind===TYPE.CART){ t.g.rotation.y=0; }
  }

  // たま
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    const steps=3;
    for(let k=0;k<steps;k++){
      const h=sdt/steps;
      const p0=s.pos.clone();
      s.vel.y-=GRAV*h;
      s.vel.x+=G.wind*h;
      s.pos.addScaledVector(s.vel,h);
      // まとに あたったか
      let hitDone=false;
      for(const t of targets){
        if(!t.alive) continue;
        const q=segSphere(p0,s.pos,t.g.position,t.radius);
        if(q){ hitTarget(t,q); hitDone=true; break; }
      }
      if(hitDone){ scene.remove(s.mesh); scene.remove(s.line); shots.splice(i,1); break; }
      if(s.pos.y<=0.05){
        splash(new THREE.Vector3(s.pos.x,0.06,s.pos.z),0x9ff0ff,8); sSplash();
        showMsg("はずれ…");
        window.__lastMiss={d:s.minD, dx:s.minAt?s.minAt.x:0, dy:s.minAt?s.minAt.y:0, dz:s.minAt?s.minAt.z:0};
        scene.remove(s.mesh); scene.remove(s.line); shots.splice(i,1);
        checkOut();
        break;
      }
    }
    if(!shots[i]||shots[i]!==s) continue;
    if(s.aim){ const d=s.pos.distanceTo(s.aim.g.position); if(d<s.minD){ s.minD=d; s.minAt=s.pos.clone().sub(s.aim.g.position); } }
    s.mesh.position.copy(s.pos);
    s.pts.push(s.pos.clone()); if(s.pts.length>60) s.pts.shift();
    const arr=s.geo.attributes.position.array;
    s.pts.forEach((p,j)=>{ arr[j*3]=p.x; arr[j*3+1]=p.y; arr[j*3+2]=p.z; });
    s.geo.setDrawRange(0,s.pts.length);
    s.geo.attributes.position.needsUpdate=true;
    s.geo.computeBoundingSphere();
    s.life+=sdt;
    if(s.life>6 || s.pos.length()>900){ scene.remove(s.mesh); scene.remove(s.line); shots.splice(i,1); checkOut(); }
  }
  // しぶき
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i];
    f.v.y-=14*sdt; f.m.position.addScaledVector(f.v,sdt); f.life-=sdt*1.6;
    f.m.scale.setScalar(Math.max(0.01,f.life));
    if(f.life<=0){ scene.remove(f.m); fx.splice(i,1); }
  }
  // きょり ひょうじ（まんなかの さきに あるもの）
  updateDist();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
const ray=new THREE.Raycaster();
function updateDist(){
  ray.setFromCamera({x:0,y:0}, camera);
  let best=null;
  for(const t of targets){ if(!t.alive) continue;
    const hit=ray.ray.intersectSphere(new THREE.Sphere(t.g.position,t.radius*2.6), new THREE.Vector3());
    if(hit){ const d=hit.distanceTo(camera.position); if(!best||d<best) best=d; }
  }
  if(best===null){
    const p=new THREE.Vector3();
    if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0), p)) best=p.distanceTo(camera.position);
  }
  document.getElementById("distLbl").textContent = best? Math.round(best) : "--";
}
function checkOut(){
  if(G.over) return;
  if(G.ammo<=0 && shots.length===0 && G.left>0){
    G.over=true; running=false; sFail();
    setTimeout(()=>sheet({t:"たまが なくなった…", s:"のこりの まと "+G.left+"こ<br>とくてん "+G.score,
      btns:[["やめる","gray",goStart],["もういっかい","yellow",()=>startStage(G.stage)]]}),500);
  }
}
function stageClear(){
  if(G.over) return;
  G.over=true; running=false;
  const miss=G.shotsFired-G.hits;
  const st=miss===0?3:(miss<=2?2:1);
  G.score+=st*100;
  if(G.stage+1>S.stage) S.stage=G.stage+1;
  if(G.score>S.best) S.best=G.score;
  save(); sClear();
  const sw=document.createElement("div"); sw.className="stars";
  for(let i=0;i<3;i++) sw.appendChild(starCanvas(i<st));
  sheet({t:"ステージ "+G.stage+" クリア！", starsEl:sw,
    s:"めいちゅう "+G.hits+" / "+G.shotsFired+" はつ<br>とくてん "+G.score+(G.score>=S.best?"（さいこう きろく！）":""),
    btns:[["やめる","gray",goStart],["もういっかい","gray",()=>startStage(G.stage)],["つぎへ","green",()=>startStage(G.stage+1)]]});
}

/* ── がめん ── */
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("show",s.id===id)); }
const ovl=document.getElementById("ovl"), sheetEl=document.getElementById("sheet");
function sheet(o){
  sheetEl.innerHTML="<h2>"+o.t+"</h2>";
  if(o.starsEl) sheetEl.appendChild(o.starsEl);
  const sub=document.createElement("div"); sub.className="sub"; sub.innerHTML=o.s||""; sheetEl.appendChild(sub);
  const row=document.createElement("div"); row.className="row";
  (o.btns||[]).forEach(([label,cls,fn])=>{
    const b=document.createElement("button"); b.className="btn "+cls; b.textContent=label;
    b.addEventListener("click",()=>{ sTick(); fn(); });
    row.appendChild(b);
  });
  sheetEl.appendChild(row);
  ovl.classList.add("show");
}
function resize(){
  const r=view.getBoundingClientRect();
  if(r.width<10||r.height<10) return;
  renderer.setSize(r.width, r.height, false);
  camera.aspect=r.width/r.height; camera.updateProjectionMatrix();
  layoutScope();
}
let rsT=null;
addEventListener("resize",()=>{ clearTimeout(rsT); rsT=setTimeout(resize,150); });
addEventListener("orientationchange",()=>{ clearTimeout(rsT); rsT=setTimeout(resize,250); });

function startStage(n){
  ovl.classList.remove("show");
  makeStage(n);
  zoomIdx=0; document.getElementById("zoomLbl").textContent="ズーム ×1";
  document.getElementById("scope").classList.remove("on");
  breath=1;
  show("play-s");
  requestAnimationFrame(()=>{ resize(); running=true; last=0; requestAnimationFrame(loop); });
}
function goStart(){
  running=false; ovl.classList.remove("show");
  document.getElementById("btnGo").textContent = S.stage>1? ("ステージ "+S.stage+" から") : "はじめる";
  document.getElementById("btnFirst").style.display = S.stage>1? "block":"none";
  document.getElementById("rec").textContent = S.best>0? ("さいこう とくてん "+S.best):"";
  show("start-s");
}
document.getElementById("btnGo").addEventListener("click",()=>{ ac(); sTick(); startStage(S.stage); });
document.getElementById("btnFirst").addEventListener("click",()=>{ ac(); sTick(); startStage(1); });

/* ── テストよう ── */
window.__T={
  start:n=>startStage(n),
  state:()=>({stage:G&&G.stage, ammo:G&&G.ammo, left:G&&G.left, score:G&&G.score, wind:G&&G.wind,
              targets:targets.filter(t=>t.alive).length, shots:shots.length, over:!!(G&&G.over), zoom:zoomIdx}),
  aimAt:i=>{  // i ばんめの まとに ねらいを つける（うごく まと・かぜ・おちかたも けいさん）
    const t=targets.filter(x=>x.alive)[i||0]; if(!t) return null;
    window.__aimT=t;
    const c=camera.position;
    let aimP=t.g.position.clone(), tof=0;
    for(let k=0;k<3;k++){                       // 2〜3かい くりかえして さきよみ
      const horiz=Math.hypot(aimP.x-c.x, aimP.z-c.z);
      tof=horiz/SPEED;
      aimP.copy(t.g.position);
      if(t.moveA>0){                            // うごく まとは とうたつ時の いちを よそく
        const now=performance.now()/1000;
        aimP.x=t.base.x+Math.sin((tAcc+tof)*t.moveSpd*2+t.bob)*t.moveA;
      }
    }
    const dx=aimP.x-c.x, dy=aimP.y-c.y, dz=aimP.z-c.z;
    const horiz=Math.sqrt(dx*dx+dz*dz);
    tof=horiz/SPEED;
    const drop=0.5*GRAV*tof*tof;
    const drift=0.5*G.wind*tof*tof;
    yaw=-Math.atan2(dx-drift, -dz);
    pitch=Math.atan2((dy+drop), horiz);
    return {yaw,pitch,dist:horiz,moving:t.moveA>0};
  },
  fire:()=>fire(),
  zoom:i=>{ zoomIdx=i; document.getElementById("zoomLbl").textContent="ズーム "+ZOOMS[i].label;
            document.getElementById("scope").classList.toggle("on", i>0); layoutScope(); },
  breath:b=>{ breathing=!!b; },
  lastMiss:()=>window.__lastMiss||null,
  windSet:w=>{ G.wind=w; updateHUD(); },
  reset:()=>{ S={stage:1,best:0}; save(); }
};

goStart();
resize();
</script>
